<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Auto Viewed</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <h1 class="panel__title">GitHub Auto Viewed</h1>
        <p id="page-state" class="panel__state">状態を確認しています…</p>
      </header>

      <section class="switches">
        <label class="switch">
          <input type="checkbox" id="enabled" />
          <span>拡張機能を有効にする</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="auto-run" />
          <span>ページを開いたら自動で実行</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="collapse" />
          <span>Viewed にしたら差分を閉じる</span>
        </label>
      </section>

      <section class="keywords-section">
        <h2 class="keywords-section__title">キーワード</h2>
        <ul id="keyword-list" class="keywords"></ul>
      </section>

      <button id="run-now" type="button" class="button button--primary">
        今すぐ Viewed にする
      </button>
      <p id="result" class="result" role="status" aria-live="polite"></p>

      <footer class="panel__footer">
        <button id="open-options" type="button" class="button button--ghost">
          キーワードの追加・詳細設定
        </button>
      </footer>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
